name: temp-sr1-legacy-bridge-release
on:
  push:
    branches: [tmp-sr2-spawner-build]
    paths:
      - '.github/workflows/temp-sr1-legacy-bridge-release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Download MelonLoader
        shell: bash
        run: |
          curl -L --fail -o melon.zip https://github.com/LavaGang/MelonLoader/releases/download/v0.7.3/MelonLoader.x64.zip
          unzip -q melon.zip -d melon
          MLDLL="$(find "$GITHUB_WORKSPACE/melon" -path '*/net6/MelonLoader.dll' | head -n 1)"
          test -n "$MLDLL"
          echo "MELON_DIR=$(dirname "$MLDLL")" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet build tmp-sr1-legacy-bridge/SR1LegacySlimesBridge.csproj -c Release -p:MelonLoaderDir="$MELON_DIR"
      - name: Prepare direct DLL
        shell: bash
        run: |
          cp tmp-sr1-legacy-bridge/bin/Release/net6.0/SR1LegacySlimesBridge.dll SR1LegacySlimesBridge_v1_0.dll
      - name: Publish direct-download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="sr1-legacy-bridge-v1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SR1LegacySlimesBridge_v1_0.dll --clobber
          else
            gh release create "$TAG" SR1LegacySlimesBridge_v1_0.dll --target "$GITHUB_SHA" --title "SR1 Legacy Slimes Bridge v1.0" --notes "Direct DLL download."
          fi
