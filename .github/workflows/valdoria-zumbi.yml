name: Valdoria Zombie Fabric 26.3 JAR
on:
  push:
    branches: [valdoria-zumbi-pacifico-build-26.3]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Extract source
        run: |
          mkdir -p valdoria-mod
          unzip -q valdoria-zumbi-source.zip -d valdoria-mod
      - name: Compile Fabric mod
        working-directory: valdoria-mod
        run: gradle build --stacktrace --no-daemon
      - name: Publish jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: Valdoria-Zumbi-Pacifico-Fabric-26.3
          path: valdoria-mod/build/libs/valdoria-zumbi-pacifico-0.1.0.jar
          if-no-files-found: error
