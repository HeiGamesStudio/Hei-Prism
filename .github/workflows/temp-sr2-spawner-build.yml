name: temp-sr2-spawner-build

on:
  push:
    branches:
      - tmp-sr2-spawner-build
    paths:
      - 'tmp-sr2-spawner/**'
      - '.github/workflows/temp-sr2-spawner-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download MelonLoader
        shell: bash
        run: |
          curl -L --fail -o melon.zip https://github.com/LavaGang/MelonLoader/releases/download/v0.7.3/MelonLoader.x64.zip
          unzip -q melon.zip -d melon
          MLDLL="$(find "$GITHUB_WORKSPACE/melon" -path '*/net6/MelonLoader.dll' | head -n 1)"
          test -n "$MLDLL"
          echo "MELON_DIR=$(dirname "$MLDLL")" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          dotnet build tmp-sr2-spawner/SR1SlimeSpawner.csproj -c Release -p:MelonLoaderDir="$MELON_DIR"

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: SR1SlimeSpawner
          path: tmp-sr2-spawner/bin/Release/net6.0/SR1SlimeSpawner.dll
          if-no-files-found: error
